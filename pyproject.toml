[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-lab-auditor"
version = "0.2.0"
description = "Local, scope-controlled Wi-Fi laboratory auditing workstation"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
  "pydantic>=2.8",
  "SQLAlchemy>=2.0",
  "psutil>=6.0",
  "pyqtgraph>=0.13",
]

[project.scripts]
wifi-lab-auditor = "app.main:main"

[tool.setuptools]
packages = ["app", "app.core", "app.database", "app.database.migrations", "app.models", "app.ui", "app.utils"]

[tool.setuptools.package-data]
"app.database.migrations" = ["*.sql"]
"app" = ["resources/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
