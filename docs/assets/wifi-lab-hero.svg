<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">WiFi Lab Auditor</title>
  <desc id="desc">Abstract dark laboratory panel with cyan wireless signal lines and a magenta data grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#120d2a"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#213152" stroke-opacity=".32" stroke-width="1"/>
      <circle cx="2" cy="2" r="1.2" fill="#00d9ff" fill-opacity=".4"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#background)"/>
  <rect x="20" y="20" width="1560" height="480" rx="20" fill="url(#grid)"/>
  <path d="M0 410 C240 315 380 470 620 375 S1030 210 1600 320" fill="none" stroke="#8b5cf6" stroke-opacity=".18" stroke-width="78"/>
  <path d="M0 410 C240 315 380 470 620 375 S1030 210 1600 320" fill="none" stroke="url(#signal)" stroke-opacity=".45" stroke-width="2"/>
  <g transform="translate(1020 70)" filter="url(#glow)" fill="none" stroke="url(#signal)" stroke-linecap="round">
    <path d="M0 188a188 188 0 0 1 376 0" stroke-width="10" stroke-opacity=".28"/>
    <path d="M44 188a144 144 0 0 1 288 0" stroke-width="9" stroke-opacity=".46"/>
    <path d="M88 188a100 100 0 0 1 200 0" stroke-width="8" stroke-opacity=".7"/>
    <circle cx="188" cy="188" r="13" fill="#00e5ff" stroke="none"/>
    <path d="M188 188v90" stroke-width="7" stroke-opacity=".7"/>
  </g>
  <g transform="translate(86 88)">
    <rect width="16" height="16" rx="5" fill="#00e5ff"/>
    <rect x="25" width="16" height="16" rx="5" fill="#8b5cf6"/>
    <rect x="50" width="16" height="16" rx="5" fill="#f472b6"/>
    <text x="0" y="122" fill="#f5f7ff" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="700" letter-spacing="-2">WiFi Lab Auditor</text>
    <text x="4" y="170" fill="#8fa6c9" font-family="Inter,Segoe UI,sans-serif" font-size="23" letter-spacing="4">LOCAL • SCOPED • EVIDENCE-DRIVEN</text>
    <rect x="4" y="218" width="360" height="2" fill="url(#accent)"/>
    <text x="4" y="266" fill="#c5d3ec" font-family="Inter,Segoe UI,sans-serif" font-size="20">Inventario, captura y recuperación offline</text>
    <text x="4" y="298" fill="#7187aa" font-family="Inter,Segoe UI,sans-serif" font-size="18">para laboratorios inalámbricos autorizados.</text>
  </g>
  <circle cx="1480" cy="76" r="5" fill="#31f2a1" filter="url(#glow)"/>
  <text x="1498" y="82" fill="#8fa6c9" font-family="Inter,Segoe UI,sans-serif" font-size="16" letter-spacing="2">SYSTEM READY</text>
</svg>
